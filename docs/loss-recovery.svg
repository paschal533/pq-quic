<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d"><title id="t">Lost first datagram: classical vs hybrid QUIC handshake recovery</title><desc id="d">Classical: the single ClientHello datagram is lost and the client waits for its 999 ms probe timeout, finishing at 1,077 ms. Hybrid: part 1 is lost, part 2 is acknowledged, the client resends part 1 at 85 ms by time-threshold loss detection and finishes at 147 ms.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.num{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.draw{stroke-dasharray:1;stroke-dashoffset:0}#k1{animation:k1 13s linear infinite}@keyframes k1{0%,0.0%{stroke-dashoffset:1;opacity:0}0.01%{opacity:1}0.8%,97%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k2{animation:k2 13s linear infinite}@keyframes k2{0%,0.8%{opacity:0}1.2000000000000002%,97%{opacity:1}100%{opacity:0}}#k3{animation:k3 13s linear infinite}@keyframes k3{0%,0.0%{stroke-dashoffset:1;opacity:0}0.01%{opacity:1}64.28%,97%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k4{animation:k4 13s linear infinite}@keyframes k4{0%,7.72%{opacity:0}8.12%,97%{opacity:1}100%{opacity:0}}#k5{animation:k5 13s linear infinite}@keyframes k5{0%,65.38%{stroke-dashoffset:1;opacity:0}65.39%{opacity:1}66.99%,97%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k6{animation:k6 13s linear infinite}@keyframes k6{0%,66.99%{stroke-dashoffset:1;opacity:0}67.0%{opacity:1}68.59%,97%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k7{animation:k7 13s linear infinite}@keyframes k7{0%,65.38%{opacity:0}65.78%,97%{opacity:1}100%{opacity:0}}#k8{animation:k8 13s linear infinite}@keyframes k8{0%,69.32%{opacity:0}69.72%,97%{opacity:1}100%{opacity:0}}#k9{animation:k9 13s linear infinite}@keyframes k9{0%,0.0%{stroke-dashoffset:1;opacity:0}0.01%{opacity:1}0.8%,97%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k10{animation:k10 13s linear infinite}@keyframes k10{0%,0.8%{opacity:0}1.2000000000000002%,97%{opacity:1}100%{opacity:0}}#k11{animation:k11 13s linear infinite}@keyframes k11{0%,0.1%{stroke-dashoffset:1;opacity:0}0.11%{opacity:1}1.71%,97%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k12{animation:k12 13s linear infinite}@keyframes k12{0%,2.25%{stroke-dashoffset:1;opacity:0}2.26%{opacity:1}3.86%,97%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k13{animation:k13 13s linear infinite}@keyframes k13{0%,5.47%{stroke-dashoffset:1;opacity:0}5.4799999999999995%{opacity:1}7.08%,97%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k14{animation:k14 13s linear infinite}@keyframes k14{0%,7.08%{stroke-dashoffset:1;opacity:0}7.09%{opacity:1}8.69%,97%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k15{animation:k15 13s linear infinite}@keyframes k15{0%,9.48%{opacity:0}9.88%,97%{opacity:1}100%{opacity:0}}#k16{animation:k16 13s linear infinite}@keyframes k16{0%,0.13%{opacity:0}0.53%,97%{opacity:1}100%{opacity:0}}#k17{animation:k17 13s linear infinite}@keyframes k17{0%,1.61%{opacity:0}2.0100000000000002%,97%{opacity:1}100%{opacity:0}}#k18{animation:k18 13s linear infinite}@keyframes k18{0%,3.86%{opacity:0}4.26%,97%{opacity:1}100%{opacity:0}}#k19{animation:k19 13s linear infinite}@keyframes k19{0%,5.47%{opacity:0}5.87%,97%{opacity:1}100%{opacity:0}}#cursor{animation:cursor 13s linear infinite}@keyframes cursor{0%{transform:translateX(0)}74.0%,100%{transform:translateX(759.0px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="520" rx="16" fill="#fbfaf6"/><text x="32.0" y="42" font-size="18" font-weight="700" fill="#1f2933">Losing the first datagram: why the hybrid hello recovers faster on rust-libp2p</text><text x="32.0" y="64" font-size="12.5" fill="#6b7280">Targeted loss of the first client Initial, 50 ms RTT, rust-libp2p 0.57.1 (quinn). Medians from CLAIMS C-18, pilot grade.</text><rect x="24" y="84" width="912" height="170" rx="12" fill="#ffffff" stroke="#e5e1d8"/><rect x="24" y="84" width="6" height="170" rx="3" fill="#b45309"/><text x="48.0" y="112" font-weight="700" font-size="15" fill="#b45309">Classical X25519</text><text x="48.0" y="130" font-size="12" fill="#6b7280">ClientHello fits in one datagram</text><line x1="110" y1="162" x2="869.0" y2="162" stroke="#e5e1d8" stroke-width="1.5"/><text x="98.0" y="166" text-anchor="end" font-size="12" fill="#6b7280">client</text><line x1="110" y1="226" x2="869.0" y2="226" stroke="#e5e1d8" stroke-width="1.5"/><text x="98.0" y="230" text-anchor="end" font-size="12" fill="#6b7280">server</text><path id="k1" class="draw" pathLength="1" d="M110.0 162 L118.2 194.0" stroke="#b45309" stroke-width="2.0" fill="none" stroke-linecap="round"/><g id="k2" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round"><path d="M112.2 188.0 L124.2 200.0 M124.2 188.0 L112.2 200.0"/></g><path id="k3" class="draw" pathLength="1" d="M129.8 176 L769.3 176" stroke="#b45309" stroke-width="3" stroke-dasharray="1" stroke-opacity="0.35" fill="none"/><text id="k4" x="446.6" y="196" text-anchor="middle" font-size="12" fill="#b45309">nothing was acknowledged, so the client waits for its probe timeout (999 ms)</text><path id="k5" class="draw" pathLength="1" d="M780.6 162 L797.1 226" stroke="#b45309" stroke-width="2.0" fill="none" stroke-linecap="round"/><path id="k6" class="draw" pathLength="1" d="M797.1 226 L813.6 162" stroke="#6b7280" stroke-width="1.4" fill="none" stroke-linecap="round"/><text id="k7" x="774.6" y="248" text-anchor="end" font-size="11.5" fill="#b45309" class="num">resend +1,016 ms</text><g id="k8"><circle cx="821.0" cy="162" r="6" fill="#b45309"/><text x="833.0" y="167" class="num" fill="#b45309" font-weight="700">1,077 ms</text></g><rect x="24" y="268" width="912" height="170" rx="12" fill="#ffffff" stroke="#e5e1d8"/><rect x="24" y="268" width="6" height="170" rx="3" fill="#0f766e"/><text x="48.0" y="296" font-weight="700" font-size="15" fill="#0f766e">Hybrid X25519MLKEM768</text><text x="48.0" y="314" font-size="12" fill="#6b7280">ClientHello (≥1,495 B) needs two datagrams of 1,200 B</text><line x1="110" y1="346" x2="869.0" y2="346" stroke="#e5e1d8" stroke-width="1.5"/><text x="98.0" y="350" text-anchor="end" font-size="12" fill="#6b7280">client</text><line x1="110" y1="410" x2="869.0" y2="410" stroke="#e5e1d8" stroke-width="1.5"/><text x="98.0" y="414" text-anchor="end" font-size="12" fill="#6b7280">server</text><path id="k9" class="draw" pathLength="1" d="M110.0 346 L118.2 378.0" stroke="#0f766e" stroke-width="2.0" fill="none" stroke-linecap="round"/><g id="k10" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round"><path d="M112.2 372.0 L124.2 384.0 M124.2 372.0 L112.2 384.0"/></g><path id="k11" class="draw" pathLength="1" d="M111.0 346 L127.5 410" stroke="#0f766e" stroke-width="2.0" fill="none" stroke-linecap="round"/><path id="k12" class="draw" pathLength="1" d="M133.1 410 L149.6 346" stroke="#0f766e" stroke-width="1.6" fill="none" stroke-linecap="round"/><path id="k13" class="draw" pathLength="1" d="M166.1 346 L182.6 410" stroke="#0f766e" stroke-width="2.0" fill="none" stroke-linecap="round"/><path id="k14" class="draw" pathLength="1" d="M182.6 410 L199.1 346" stroke="#6b7280" stroke-width="1.4" fill="none" stroke-linecap="round"/><g id="k15"><circle cx="207.3" cy="346" r="6" fill="#0f766e"/><text x="219.3" y="351" class="num" fill="#0f766e" font-weight="700">147 ms</text></g><text id="k16" x="308.0" y="342" font-size="12.5" fill="#1f2933">①  part 1 of the ClientHello is lost</text><text id="k17" x="308.0" y="363" font-size="12.5" fill="#1f2933">②  part 2 arrives, and the server acknowledges it (48 B Initial ACK)</text><text id="k18" x="308.0" y="384" font-size="12.5" fill="#1f2933">③  a later packet was acked, so RFC 9002's time threshold marks part 1 lost</text><text id="k19" x="308.0" y="405" font-size="12.5" fill="#1f2933">④  the client resends part 1 at +85 ms, no timeout needed</text><line x1="110" y1="462" x2="869.0" y2="462" stroke="#6b7280"/><line x1="110.0" y1="462" x2="110.0" y2="467" stroke="#6b7280"/><text x="110.0" y="481" text-anchor="middle" font-size="11" fill="#6b7280" class="num">0</text><line x1="176.0" y1="462" x2="176.0" y2="467" stroke="#6b7280"/><line x1="242.0" y1="462" x2="242.0" y2="467" stroke="#6b7280"/><text x="242.0" y="481" text-anchor="middle" font-size="11" fill="#6b7280" class="num">200</text><line x1="308.0" y1="462" x2="308.0" y2="467" stroke="#6b7280"/><line x1="374.0" y1="462" x2="374.0" y2="467" stroke="#6b7280"/><text x="374.0" y="481" text-anchor="middle" font-size="11" fill="#6b7280" class="num">400</text><line x1="440.0" y1="462" x2="440.0" y2="467" stroke="#6b7280"/><line x1="506.0" y1="462" x2="506.0" y2="467" stroke="#6b7280"/><text x="506.0" y="481" text-anchor="middle" font-size="11" fill="#6b7280" class="num">600</text><line x1="572.0" y1="462" x2="572.0" y2="467" stroke="#6b7280"/><line x1="638.0" y1="462" x2="638.0" y2="467" stroke="#6b7280"/><text x="638.0" y="481" text-anchor="middle" font-size="11" fill="#6b7280" class="num">800</text><line x1="704.0" y1="462" x2="704.0" y2="467" stroke="#6b7280"/><line x1="770.0" y1="462" x2="770.0" y2="467" stroke="#6b7280"/><text x="770.0" y="481" text-anchor="middle" font-size="11" fill="#6b7280" class="num">1,000</text><line x1="836.0" y1="462" x2="836.0" y2="467" stroke="#6b7280"/><text x="869.0" y="481" text-anchor="end" font-size="11" fill="#6b7280">ms</text><line id="cursor" x1="110" y1="88" x2="110" y2="462" stroke="#1f2933" stroke-opacity="0.25" stroke-width="1.5"/><text x="32.0" y="504" font-size="11.5" fill="#6b7280">go-libp2p (quic-go) waits only 200 ms for its first probe, so there the gap is 268.5 vs 149.7 ms. Under random loss the sign depends on the stack: see C-22, C-25, C-31.</text></svg>
